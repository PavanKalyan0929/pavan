    <meta charset="UTF-8" />

    <meta name="description" content="Statewide higher-education student services platform for Andhra Pradesh featuring college discovery, fee tracking, AI-assisted grievance redressal, scholarship directory, and institutional admin dashboards." />
    <meta property="og:title" content="Andhra Student Hub — AP Higher Education & Student Services" />
    <meta property="og:description" content="Explore Andhra Pradesh colleges, track scholarships and fees, file AI-assisted grievances, and connect with verified institutional administrators." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ash_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-slate-950 text-[#0F172A] dark:text-slate-100 antialiased selection:bg-[#1E40AF]/15 dark:selection:bg-blue-500/30 selection:text-[#1E40AF] dark:selection:text-blue-200 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
